<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2011 — সিপিআই(এম) পশ্চিমবঙ্গ</title>
<style>
  :root{
    --red:#cc0000; --red-d:#a30000; --red-dd:#7a0000; --red-l:#e63946;
    --wash-1:#fbe9e9; --wash-2:#f5d6d6;
    --page:#fdf7f7; --panel:#fff; --panel-2:#fbf2f2;
    --line:#c49a9a; --grid:#b98d8d; --grid-2:#dcbfbf;
    --ink:#0f0f14; --ink-dim:#2b2b33; --gold:#ffd166;
    --face:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  html[lang="bn"]{
    --face:"Noto Sans Bengali","Noto Serif Bengali","Lohit Bengali","Shonar Bangla",
           "Nirmala UI","Vrinda","Kalpurush","Mukti Narrow",
           "Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  html[lang="bn"] body{line-height:1.55}
  html[lang="bn"] .fld label,html[lang="bn"] .chip .k,
  html[lang="bn"] thead th{letter-spacing:.2px;text-transform:none}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font:14px/1.45 var(--face);color:var(--ink);background:var(--page);
       background-image:
         radial-gradient(1100px 620px at 12% -12%,rgba(204,0,0,.12) 0%,rgba(204,0,0,0) 62%),
         radial-gradient(880px 560px at 100% 0%,rgba(204,0,0,.09) 0%,rgba(204,0,0,0) 58%),
         linear-gradient(175deg,#fff 0%,#fdf6f6 45%,#f8ecec 100%);
       background-attachment:fixed;min-height:100vh;overflow-x:hidden}
  a{color:var(--red-d)}
  header.top{padding:14px 22px 12px;border-bottom:3px solid var(--red);
             background:rgba(255,255,255,.94);position:sticky;top:0;z-index:20;
             backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(122,0,0,.12)}
  .brand{display:flex;align-items:center;gap:12px}
  .brand svg{width:52px;height:35px;flex:none;box-shadow:0 1px 5px rgba(122,0,0,.25)}
  h1{margin:0;font-size:18px;font-weight:700;color:#6b0000;letter-spacing:.3px}
  h1 .sub{display:block;font-size:12px;font-weight:500;color:var(--ink-dim);margin-top:2px}
  .back{margin-left:auto;font-size:13px;font-weight:600;text-decoration:none;
        border:1px solid var(--line);border-radius:6px;padding:6px 12px;background:#fff}
  .back:hover{background:var(--wash-1)}
  .wrap{padding:16px 22px 56px;max-width:1800px;margin:0 auto}
  .controls{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-top:12px}
  .fld{display:flex;flex-direction:column;gap:4px;min-width:0}
  .fld label{font-size:11px;text-transform:uppercase;letter-spacing:.8px;
             font-weight:700;color:#5c3838}
  select,input[type=text],button{font:inherit;color:var(--ink);background:#fff;
    border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:90px;
    max-width:100%;outline:none}
  select:focus{border-color:var(--red);box-shadow:0 0 0 2px rgba(204,0,0,.16)}
  select:disabled{opacity:.5;cursor:not-allowed;background:#f4eeee}
  select option:disabled{color:#a58c8c;font-style:italic}
  #ac,#cac{min-width:260px} #dist,#cdist{min-width:190px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
  .seg button{border:0;border-radius:0;background:transparent;padding:7px 14px;min-width:0;cursor:pointer}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--red);color:#fff;font-weight:600}
  .note{margin-top:14px;padding:9px 12px;border-radius:6px;font-size:13px;
        background:var(--wash-1);border:1px solid var(--line);
        border-left:4px solid var(--red)}
  .note.warn{border-left-color:#e8890b;background:#fff6e8}
  .hide{display:none!important}
  .cards{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0 6px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:9px;
        padding:10px 14px;min-width:120px;box-shadow:0 2px 6px rgba(122,0,0,.14)}
  .card .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;font-weight:700;color:#5c3838}
  .card .v{font-size:19px;font-weight:700;margin-top:2px;color:#6b0000}
  .card .s{font-size:11.5px;color:var(--ink-dim)}
  .rowcount{margin-top:10px;font-size:12.5px;color:var(--ink-dim)}
  .tablewrap{margin-top:12px;border:2px solid var(--red-d);border-radius:9px;
             overflow:auto;max-height:74vh;background:#fff;
             box-shadow:0 5px 18px rgba(122,0,0,.22)}
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;
        white-space:nowrap;background:#fff}
  thead th{position:sticky;top:0;z-index:5;background:var(--red);color:#fff;
           padding:8px 10px;text-align:right;font-weight:600;font-size:11.5px;
           letter-spacing:.4px;cursor:pointer;border-bottom:2px solid var(--red-dd);
           border-right:1px solid rgba(255,255,255,.32)}
  thead th.grp{top:0;z-index:6;text-align:center;background:var(--red-dd);cursor:default;
               font-size:11px;font-weight:700;height:28px;padding:5px 10px}
  thead tr.r2 th{top:28px}
  thead th:last-child{border-right:0}
  thead th.l{text-align:left}
  thead th:hover{background:var(--red-l)}
  thead th.grp:hover{background:var(--red-dd)}
  thead th.sorted::after{content:"\25B4";margin-left:5px;color:var(--gold)}
  thead th.sorted.desc::after{content:"\25BE"}
  th.sn,td.sn{width:3.4em;min-width:3.4em;text-align:right;padding-right:8px}
  td.sn{color:#7a6a6a;font-weight:400;font-size:12px}
  tbody td{padding:6px 10px;text-align:right;color:var(--ink);font-weight:600;
           font-variant-numeric:tabular-nums;background:#fff;
           border-bottom:1px solid var(--grid-2);border-right:1px solid var(--grid-2)}
  tbody td:last-child{border-right:0}
  tbody td.l,tbody td.dim{font-weight:400}
  tbody tr:nth-child(even) td{background:var(--panel-2)}
  tbody tr:hover td{background:var(--wash-2)}
  tbody td.win{color:var(--red);font-weight:700}
  td.na{color:#b9a5a5;font-weight:400}
  tfoot td{position:sticky;bottom:0;background:var(--wash-1);color:var(--red-dd);
           font-weight:700;padding:8px 10px;text-align:right;
           border-top:2px solid var(--red-d);font-variant-numeric:tabular-nums}
  tfoot td.l{text-align:left}
  .mwrap{display:inline-flex;align-items:center;gap:9px;justify-content:center}
  .mseg{display:inline-flex;border:1px solid rgba(255,255,255,.55);border-radius:5px;overflow:hidden}
  .mbtn{font:inherit;font-size:10px;font-weight:600;padding:2px 8px;border:0;
        background:transparent;color:#fff;cursor:pointer;white-space:nowrap;line-height:1.5}
  .mbtn+.mbtn{border-left:1px solid rgba(255,255,255,.45)}
  .mbtn.on{background:#fff;color:var(--red-dd)}
  .mbtn:not(.on):hover{background:rgba(255,255,255,.22)}
  footer.foot{padding:8px 22px 26px;display:flex;justify-content:center}
  footer.foot svg{width:96px;height:64px;box-shadow:0 1px 6px rgba(122,0,0,.18)}
  @media (max-width:640px){
    header.top{position:static;padding:11px 12px}
    body{background-attachment:scroll}
    h1{font-size:15px} .brand svg{width:42px;height:28px}
    .wrap{padding:12px 12px 36px} footer.foot{padding:0 12px 18px}
    .controls{gap:10px} .controls .fld{flex:1 1 100%}
    select,input[type=text],button{font-size:16px;padding:9px 10px;min-width:0;width:100%}
    #ac,#dist,#cac,#cdist{min-width:0;width:100%}
    .seg{display:flex;width:100%} .seg button{flex:1 1 0;padding:10px 6px;font-size:13px}
    .cards{gap:8px} .card{flex:1 1 calc(50% - 4px);min-width:0;padding:8px 10px}
    .card .v{font-size:15.5px} .tablewrap{max-height:76vh}
    table{font-size:12px} thead th{padding:6px 8px;font-size:10.5px}
    tbody td,tfoot td{padding:6px 8px}
    th.sn,td.sn{width:2.6em;min-width:2.6em}
  }
</style>
</head>

<header class="top">
  <div class="brand">
    <svg viewBox="0 0 342.9 228.6" role="img" aria-label="CPI(M)"><use href="#cpimMark"/></svg>
    <h1><span data-i18n="org"></span><span class="sub" id="ptitle"></span></h1>
    <a class="back" href="index.html" data-i18n="back"></a>
  </div>
  <div class="controls">
    <div class="fld"><label for="dist" data-i18n="district"></label><select id="dist"></select></div>
    <div class="fld"><label for="ac" data-i18n="ac"></label><select id="ac"></select></div>
    <div class="fld">
      <label data-i18n="language"></label>
      <div class="seg" id="lang">
        <button data-l="bn" lang="bn">বাংলা</button>
        <button data-l="en" lang="en">English</button>
      </div>
    </div>
  </div>
</header>
<div class="wrap">
  <div id="msg" class="note hide"></div>
  <div id="cards" class="cards hide"></div>
  <div id="rowcount" class="rowcount"></div>
  <div id="tw" class="tablewrap hide"><table id="tbl"></table></div>
</div>

    rCaution:'এটি {n}টি {unit}-এর গড় মিলিয়ে দেখা সম্পর্ক। কোন ভোটার কাকে ভোট দিয়েছেন তা এ থেকে জানা যায় না — কেবল কোন ধরনের এলাকায় কোন দল ভালো করেছে তা বোঝা যায়।'
  },

};
let LANG = 'bn';
const t = (k, v) => {
  let s = (I18N[LANG] && I18N[LANG][k]) != null ? I18N[LANG][k] : I18N.en[k];
  if (s == null) return k;
  if (v) for (const n in v) s = s.split('{' + n + '}').join(v[n]);
  return s;
};
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => (n == null || isNaN(n)) ? '' : n.toLocaleString('en-IN');
const pc = (v, tot) => tot > 0 ? (v * 100 / tot) : 0;
const p2 = v => v.toFixed(2) + '%';
/* Booth labels are usually numbers, but an auxiliary station is written "18A"
   and has to fall between 18 and 19 rather than at the end of the column. */
function boothKey(v){
  if (typeof v === 'number') return v * 100;
  const m = /^(\d+)\s*([A-Za-z])$/.exec(String(v));
  return m ? (+m[1]) * 100 + (m[2].toUpperCase().charCodeAt(0) - 64) : 1e12;
}

function applyStatic(){
  document.documentElement.lang = LANG;
  for (const el of document.querySelectorAll('[data-i18n]')) el.innerHTML = t(el.dataset.i18n);
  for (const el of document.querySelectorAll('#lang button')) el.classList.toggle('on', el.dataset.l === LANG);
}
function langSwitch(after){
  const box = $('lang');
  if (!box) return;
  box.onclick = e => {
    const b = e.target.closest('button[data-l]');
    if (!b || b.dataset.l === LANG) return;
    LANG = b.dataset.l;
    applyStatic();
    if (after) after();
  };
}


/* ---------- district / assembly pickers, shared by both page kinds ------- */
function distLabel(D, slug){ const e = D.dists && D.dists[slug]; return e ? (LANG === 'bn' ? e[0] : e[1]) : slug; }
function acLabel(D, no){ const m = D.acmap[no]; return m ? ((LANG === 'bn' && m[2]) || m[0]) : ('AC ' + no); }

function districtsOf(D){
  const g = new Map();
  for (const no in D.acmap) {
    const d = D.acmap[no][1];
    if (!g.has(d)) g.set(d, []);
    g.get(d).push(+no);
  }
  return g;
}
function fillDistricts(sel, D, cur){
  const g = districtsOf(D), have = new Set(D.have);
  const names = [...g.keys()].sort((a, b) => distLabel(D, a).localeCompare(distLabel(D, b), LANG));
  let h = `<option value="">${esc(t('pickDistrict'))}</option>`;
  for (const d of names) {
    const acs = g.get(d);
    const n = acs.filter(x => have.has(x)).length;
    h += `<option value="${esc(d)}">${esc(distLabel(D, d))} (${n}/${acs.length})</option>`;
  }
  sel.innerHTML = h;
  sel.value = cur || '';
  sel._g = g;
}
function fillACs(sel, D, dist, cur){
  if (!dist) {
    sel.innerHTML = `<option value="">${esc(t('districtFirst'))}</option>`;
    sel.disabled = true;
    return;
  }
  sel.disabled = false;
  const have = new Set(D.have);
  let h = `<option value="">${esc(t('pickAc'))}</option>`;
  for (const no of (sel._g || districtsOf(D)).get(dist).slice().sort((a, b) => a - b)) {
    const ok = have.has(no);
    h += `<option value="${no}"${ok ? '' : ' disabled'}>${no} – ${esc(acLabel(D, no))}`
       + (ok ? '' : esc(t('noData'))) + '</option>';
  }
  sel.innerHTML = h;
  sel.value = cur == null ? '' : String(cur);
}

/* ---------- the table ----------------------------------------------------
   One renderer for both pages.  A column declares how to sort itself (val)
   and how to print itself (cell); the serial is written after the sort, so
   it always numbers what is on screen. */
function Grid(el, state){ this.el = el; this.s = state; }
Grid.prototype.draw = function(cols, rows, opt){
  opt = opt || {};
  const s = this.s;
  const col = cols.find(c => c.k === s.key) || cols[0];
  if (col) {
    const dir = s.dir;
    rows = rows.slice().sort((a, b) => {
      const x = col.val(a), y = col.val(b);
      if (x == null && y == null) return 0;
      if (x == null) return 1;                    /* blanks always last */
      if (y == null) return -1;
      if (x < y) return -dir;
      if (x > y) return dir;
      return 0;
    });
  }
  let h = '';
  if (opt.groups) {
    h += '<thead><tr>';
    for (const g of opt.groups)
      h += `<th class="grp"${g.span > 1 ? ` colspan="${g.span}"` : ''}${g.align ? ` style="text-align:${g.align}"` : ''}>${g.h}</th>`;
    h += '</tr><tr class="r2">';
  } else {
    h += '<thead><tr class="r2">';
  }
  h += `<th class="sn" title="${esc(t('snHelp'))}">${esc(t('colSn'))}</th>`;
  for (const c of cols) {
    const on = s.key === c.k ? ' sorted' + (s.dir < 0 ? ' desc' : '') : '';
    h += `<th class="${c.cls || ''}${on}" data-k="${c.k}"`
       + (c.title ? ` title="${esc(c.title)}"` : '') + `>${c.h}</th>`;
  }
  h += '</tr></thead><tbody>';
  let n = 0;
  for (const r of rows) {
    h += '<tr><td class="sn">' + (++n) + '</td>';
    for (const c of cols) h += c.cell(r);
    h += '</tr>';
  }
  h += '</tbody>';
  if (opt.foot) h += '<tfoot><tr><td class="sn"></td>' + opt.foot(rows) + '</tr></tfoot>';
  this.el.innerHTML = h;
  this.rows = rows;
};
function gridClicks(tbl, state, redraw){
  tbl.addEventListener('click', e => {
    const mb = e.target.closest('.mbtn');
    if (mb) { e.stopPropagation(); if (mb.dataset.v !== state.measure) { state.measure = mb.dataset.v; redraw(); } return; }
    const th = e.target.closest('th[data-k]');
    if (!th) return;
    const k = th.dataset.k;
    if (state.key === k) state.dir *= -1;
    else { state.key = k; state.dir = th.classList.contains('l') ? 1 : -1; }
    redraw();
  });
}
function measureSwitch(state, label){
  const b = v => `<button type="button" class="mbtn${state.measure === v ? ' on' : ''}" data-v="${v}">`
                 + esc(t(v === 'pct' ? 'mPct' : 'mVotes')) + '</button>';
  return `<span class="mwrap">${label}<span class="mseg">${b('votes')}${b('pct')}</span></span>`;
}

const YEAR = 2011, KIND = 'assembly';
const D = window.EL[YEAR];
const S = {dist:'', ac:null, key:'ps', dir:1, measure:'votes'};
const grid = new Grid($('tbl'), S);

function setTitle(){ $('ptitle').textContent = YEAR + ' · ' + t(KIND); }

function acOf(no){ return D.acs.find(a => a.no === no); }

function render(){
  const ac = S.ac == null ? null : acOf(S.ac);
  $('cards').classList.toggle('hide', !ac);
  $('tw').classList.toggle('hide', !ac);
  if (!ac) {
    $('rowcount').textContent = '';
    $('tbl').innerHTML = '';
    $('msg').className = 'note';
    $('msg').innerHTML = S.dist ? t('startAc') : t('startDistrict');
    return;
  }
  $('msg').className = 'note';
  $('msg').innerHTML = t('noBoothName');

  const np = ac.parties.length;
  const rows = ac.booths.map(b => ({ps:b[0], v:b[1], tot:b[2]}));
  const sums = new Array(np).fill(0);
  let gtot = 0;
  for (const r of rows) { r.v.forEach((x, i) => sums[i] += x); gtot += r.tot; }
  const ord = sums.map((x, i) => i).sort((a, b) => sums[b] - sums[a]);
  const win = ord[0], run = ord[1];

  const pct = S.measure === 'pct';
  const cols = [{k:'ps', h:esc(t('colBooth')), cls:'', val:r => boothKey(r.ps),
                 cell:r => `<td class="dim">${esc(r.ps)}</td>`}];
  ac.parties.forEach((p, i) => cols.push({
    k:'c' + i, h:esc(p[0]), title:p[1],
    val:r => pct ? pc(r.v[i], r.tot) : r.v[i],
    cell:r => `<td class="${r.v[i] === Math.max.apply(null, r.v) && r.v[i] > 0 ? 'win' : ''}">`
            + (pct ? p2(pc(r.v[i], r.tot)) : fmt(r.v[i])) + '</td>'
  }));
  cols.push({k:'tot', h:esc(t('colTotal')), val:r => r.tot, cell:r => `<td>${fmt(r.tot)}</td>`});

  grid.draw(cols, rows, {
    groups:[{h:esc(t('grpBooth')), span:2, align:'left'},
            {h:measureSwitch(S, esc(pct ? t('grpVotesPct') : t('grpVotes'))), span:np},
            {h:'&nbsp;', span:1}],
    foot:rs => {
      let h = `<td class="l">${esc(t('footTotal', {n:fmt(rs.length)}))}</td>`;
      for (let i = 0; i < np; i++) h += `<td>${pct ? p2(pc(sums[i], gtot)) : fmt(sums[i])}</td>`;
      return h + `<td>${fmt(gtot)}</td>`;
    }
  });

  $('cards').innerHTML = [
    [t('cardAc'), `${ac.no} – ${esc(acLabel(D, ac.no))}`, t('cardAcSub', {d:esc(distLabel(D, ac.dist))})],
    [t('cardBooths'), fmt(rows.length), t('cardVotes', {n:fmt(gtot)})],
    [t('cardLeading'), esc(ac.parties[win][0]), fmt(sums[win]) + ' · ' + p2(pc(sums[win], gtot))],
    [t('cardMargin'), fmt(sums[win] - (run != null ? sums[run] : 0)),
      run != null ? t('cardOver', {name:esc(ac.parties[run][0])}) : '']
  ].map(c => `<div class="card"><div class="k">${c[0]}</div><div class="v">${c[1]}</div><div class="s">${c[2]}</div></div>`).join('');
  $('rowcount').textContent = t('boothsShown', {n:fmt(rows.length)});
}

$('dist').onchange = e => { S.dist = e.target.value; S.ac = null;
  fillACs($('ac'), D, S.dist, null); render(); };
$('ac').onchange = e => { S.ac = e.target.value ? +e.target.value : null;
  S.key = 'ps'; S.dir = 1; render(); };
gridClicks($('tbl'), S, render);
langSwitch(() => { setTitle(); fillDistricts($('dist'), D, S.dist);
  fillACs($('ac'), D, S.dist, S.ac); render(); });

applyStatic(); setTitle();
fillDistricts($('dist'), D, S.dist);
fillACs($('ac'), D, S.dist, S.ac);
render();

</script>
</body>
