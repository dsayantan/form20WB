<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>তুলনা — সিপিআই(এম) পশ্চিমবঙ্গ</title>
<style>
  :root{
    --red:#cc0000; --red-d:#a30000; --red-dd:#7a0000; --red-l:#e63946;
    --wash-1:#fbe9e9; --wash-2:#f5d6d6;
    --page:#fdf7f7; --panel:#fff; --panel-2:#fbf2f2;
    --line:#c49a9a; --grid:#b98d8d; --grid-2:#dcbfbf;
    --ink:#0f0f14; --ink-dim:#2b2b33; --gold:#ffd166;
    --face:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  html[lang="bn"]{
    --face:"Noto Sans Bengali","Noto Serif Bengali","Lohit Bengali","Shonar Bangla",
           "Nirmala UI","Vrinda","Kalpurush","Mukti Narrow",
           "Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  html[lang="bn"] body{line-height:1.55}
  html[lang="bn"] .fld label,html[lang="bn"] .chip .k,
  html[lang="bn"] thead th{letter-spacing:.2px;text-transform:none}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font:14px/1.45 var(--face);color:var(--ink);background:var(--page);
       background-image:
         radial-gradient(1100px 620px at 12% -12%,rgba(204,0,0,.12) 0%,rgba(204,0,0,0) 62%),
         radial-gradient(880px 560px at 100% 0%,rgba(204,0,0,.09) 0%,rgba(204,0,0,0) 58%),
         linear-gradient(175deg,#fff 0%,#fdf6f6 45%,#f8ecec 100%);
       background-attachment:fixed;min-height:100vh;overflow-x:hidden}
  a{color:var(--red-d)}
  header.top{padding:14px 22px 12px;border-bottom:3px solid var(--red);
             background:rgba(255,255,255,.94);position:sticky;top:0;z-index:20;
             backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(122,0,0,.12)}
  .brand{display:flex;align-items:center;gap:12px}
  .brand svg{width:52px;height:35px;flex:none;box-shadow:0 1px 5px rgba(122,0,0,.25)}
  h1{margin:0;font-size:18px;font-weight:700;color:#6b0000;letter-spacing:.3px}
  h1 .sub{display:block;font-size:12px;font-weight:500;color:var(--ink-dim);margin-top:2px}
  .back{margin-left:auto;font-size:13px;font-weight:600;text-decoration:none;
        border:1px solid var(--line);border-radius:6px;padding:6px 12px;background:#fff}
  .back:hover{background:var(--wash-1)}
  .wrap{padding:16px 22px 56px;max-width:1800px;margin:0 auto}
  .controls{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-top:12px}
  .fld{display:flex;flex-direction:column;gap:4px;min-width:0}
  .fld label{font-size:11px;text-transform:uppercase;letter-spacing:.8px;
             font-weight:700;color:#5c3838}
  select,input[type=text],button{font:inherit;color:var(--ink);background:#fff;
    border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:90px;
    max-width:100%;outline:none}
  select:focus{border-color:var(--red);box-shadow:0 0 0 2px rgba(204,0,0,.16)}
  select:disabled{opacity:.5;cursor:not-allowed;background:#f4eeee}
  select option:disabled{color:#a58c8c;font-style:italic}
  #ac,#cac{min-width:260px} #dist,#cdist{min-width:190px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
  .seg button{border:0;border-radius:0;background:transparent;padding:7px 14px;min-width:0;cursor:pointer}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--red);color:#fff;font-weight:600}
  .note{margin-top:14px;padding:9px 12px;border-radius:6px;font-size:13px;
        background:var(--wash-1);border:1px solid var(--line);
        border-left:4px solid var(--red)}
  .note.warn{border-left-color:#e8890b;background:#fff6e8}
  .hide{display:none!important}
  .cards{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0 6px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:9px;
        padding:10px 14px;min-width:120px;box-shadow:0 2px 6px rgba(122,0,0,.14)}
  .card .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;font-weight:700;color:#5c3838}
  .card .v{font-size:19px;font-weight:700;margin-top:2px;color:#6b0000}
  .card .s{font-size:11.5px;color:var(--ink-dim)}
  .rowcount{margin-top:10px;font-size:12.5px;color:var(--ink-dim)}
  .tablewrap{margin-top:12px;border:2px solid var(--red-d);border-radius:9px;
             overflow:auto;max-height:74vh;background:#fff;
             box-shadow:0 5px 18px rgba(122,0,0,.22)}
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;
        white-space:nowrap;background:#fff}
  thead th{position:sticky;top:0;z-index:5;background:var(--red);color:#fff;
           padding:8px 10px;text-align:right;font-weight:600;font-size:11.5px;
           letter-spacing:.4px;cursor:pointer;border-bottom:2px solid var(--red-dd);
           border-right:1px solid rgba(255,255,255,.32)}
  thead th.grp{top:0;z-index:6;text-align:center;background:var(--red-dd);cursor:default;
               font-size:11px;font-weight:700;height:28px;padding:5px 10px}
  thead tr.r2 th{top:28px}
  thead th:last-child{border-right:0}
  thead th.l{text-align:left}
  thead th:hover{background:var(--red-l)}
  thead th.grp:hover{background:var(--red-dd)}
  thead th.sorted::after{content:"\25B4";margin-left:5px;color:var(--gold)}
  thead th.sorted.desc::after{content:"\25BE"}
  th.sn,td.sn{width:3.4em;min-width:3.4em;text-align:right;padding-right:8px}
  td.sn{color:#7a6a6a;font-weight:400;font-size:12px}
  tbody td{padding:6px 10px;text-align:right;color:var(--ink);font-weight:600;
           font-variant-numeric:tabular-nums;background:#fff;
           border-bottom:1px solid var(--grid-2);border-right:1px solid var(--grid-2)}
  tbody td:last-child{border-right:0}
  tbody td.l,tbody td.dim{font-weight:400}
  tbody tr:nth-child(even) td{background:var(--panel-2)}
  tbody tr:hover td{background:var(--wash-2)}
  tbody td.win{color:var(--red);font-weight:700}
  td.na{color:#b9a5a5;font-weight:400}
  tfoot td{position:sticky;bottom:0;background:var(--wash-1);color:var(--red-dd);
           font-weight:700;padding:8px 10px;text-align:right;
           border-top:2px solid var(--red-d);font-variant-numeric:tabular-nums}
  tfoot td.l{text-align:left}
  .mwrap{display:inline-flex;align-items:center;gap:9px;justify-content:center}
  .mseg{display:inline-flex;border:1px solid rgba(255,255,255,.55);border-radius:5px;overflow:hidden}
  .mbtn{font:inherit;font-size:10px;font-weight:600;padding:2px 8px;border:0;
        background:transparent;color:#fff;cursor:pointer;white-space:nowrap;line-height:1.5}
  .mbtn+.mbtn{border-left:1px solid rgba(255,255,255,.45)}
  .mbtn.on{background:#fff;color:var(--red-dd)}
  .mbtn:not(.on):hover{background:rgba(255,255,255,.22)}
  footer.foot{padding:8px 22px 26px;display:flex;justify-content:center}
  footer.foot svg{width:96px;height:64px;box-shadow:0 1px 6px rgba(122,0,0,.18)}
  @media (max-width:640px){
    header.top{position:static;padding:11px 12px}
    body{background-attachment:scroll}
    h1{font-size:15px} .brand svg{width:42px;height:28px}
    .wrap{padding:12px 12px 36px} footer.foot{padding:0 12px 18px}
    .controls{gap:10px} .controls .fld{flex:1 1 100%}
    select,input[type=text],button{font-size:16px;padding:9px 10px;min-width:0;width:100%}
    #ac,#dist,#cac,#cdist{min-width:0;width:100%}
    .seg{display:flex;width:100%} .seg button{flex:1 1 0;padding:10px 6px;font-size:13px}
    .cards{gap:8px} .card{flex:1 1 calc(50% - 4px);min-width:0;padding:8px 10px}
    .card .v{font-size:15.5px} .tablewrap{max-height:76vh}
    table{font-size:12px} thead th{padding:6px 8px;font-size:10.5px}
    tbody td,tfoot td{padding:6px 8px}
    th.sn,td.sn{width:2.6em;min-width:2.6em}
  }

  .panel{margin-top:14px;background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px 14px;box-shadow:0 2px 8px rgba(122,0,0,.12)}
  .panel h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:#5c3838}
  .yrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 0;
        border-top:1px solid var(--grid-2)}
  .yrow:first-of-type{border-top:0}
  .ylab{min-width:190px;font-weight:700;color:var(--red-dd);display:flex;align-items:center;gap:8px}
  .ylab .kind{font-weight:500;font-size:12px;color:var(--ink-dim)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 auto}
  .chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);
        border-radius:999px;padding:3px 11px;font-size:12.5px;cursor:pointer;background:#fff;
        user-select:none}
  .chip:hover{background:var(--wash-1)}
  .chip.on{background:var(--red);color:#fff;border-color:var(--red-d);font-weight:600}
  .chip input{display:none}
  .muted{color:#9c8888;font-size:12.5px;font-style:italic}
  #report.on{background:var(--red);color:#fff;border-color:var(--red-d);font-weight:600}
  .rep h3{margin:0 0 4px}
  .rep .grp{margin-top:12px;border-top:1px solid var(--grid-2);padding-top:10px}
  .rep .grp:first-of-type{border-top:0;padding-top:0}
  .rep .who{font-weight:700;color:var(--red-dd);margin-bottom:6px}
  .rep .line{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;padding:4px 0;font-size:13.5px}
  .rep .var{min-width:132px;font-weight:600}
  .rep .r{font-variant-numeric:tabular-nums;color:var(--ink-dim);font-size:12.5px}
  .rep .bar2{flex:0 0 96px;height:7px;border-radius:4px;background:var(--wash-2);
             position:relative;overflow:hidden}
  .rep .bar2 i{position:absolute;top:0;bottom:0;left:50%;background:var(--red)}
  .rep .bar2 i.neg{background:#5b7fa6}
  .rep .say{flex:1 1 260px;color:var(--ink-dim)}
  .rep .caution{margin-top:12px;font-size:12.5px;color:#6b5555;font-style:italic}
  @media (max-width:640px){ .rep .var{min-width:0;flex:1 1 100%} .rep .bar2{flex:0 0 70px} }
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
  @media (max-width:640px){ .ylab{min-width:0;flex:1 1 100%} }
</style>
</head>

  <div class="brand">
    <svg viewBox="0 0 342.9 228.6" role="img" aria-label="CPI(M)"><use href="#cpimMark"/></svg>
    <h1><span data-i18n="org"></span><span class="sub" id="ptitle"></span></h1>

    <div class="fld"><label for="dist" data-i18n="district"></label><select id="dist"></select></div>

    <div class="fld">
      <label data-i18n="viewBy"></label>
      <div class="seg" id="viewby">
        <button data-v="booth" class="on" data-i18n="byBooth"></button>

<script>
"use strict";

const I18N = {

let LANG = 'bn';
const t = (k, v) => {
  let s = (I18N[LANG] && I18N[LANG][k]) != null ? I18N[LANG][k] : I18N.en[k];
  if (s == null) return k;
  if (v) for (const n in v) s = s.split('{' + n + '}').join(v[n]);
  return s;
};
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => (n == null || isNaN(n)) ? '' : n.toLocaleString('en-IN');
const pc = (v, tot) => tot > 0 ? (v * 100 / tot) : 0;
const p2 = v => v.toFixed(2) + '%';
/* Booth labels are usually numbers, but an auxiliary station is written "18A"
   and has to fall between 18 and 19 rather than at the end of the column. */
function boothKey(v){
  if (typeof v === 'number') return v * 100;
  const m = /^(\d+)\s*([A-Za-z])$/.exec(String(v));
  return m ? (+m[1]) * 100 + (m[2].toUpperCase().charCodeAt(0) - 64) : 1e12;
}

function applyStatic(){

function distLabel(D, slug){ const e = D.dists && D.dists[slug]; return e ? (LANG === 'bn' ? e[0] : e[1]) : slug; }
function acLabel(D, no){ const m = D.acmap[no]; return m ? ((LANG === 'bn' && m[2]) || m[0]) : ('AC ' + no); }

function districtsOf(D){
  const g = new Map();
  for (const no in D.acmap) {
    const d = D.acmap[no][1];
    if (!g.has(d)) g.set(d, []);
    g.get(d).push(+no);
  }
  return g;
}
function fillDistricts(sel, D, cur){
  const g = districtsOf(D), have = new Set(D.have);
  const names = [...g.keys()].sort((a, b) => distLabel(D, a).localeCompare(distLabel(D, b), LANG));
  let h = `<option value="">${esc(t('pickDistrict'))}</option>`;
  for (const d of names) {

    h += `<option value="${esc(d)}">${esc(distLabel(D, d))} (${n}/${acs.length})</option>`;
  }
  sel.innerHTML = h;

function fillACs(sel, D, dist, cur){
  if (!dist) {
    sel.innerHTML = `<option value="">${esc(t('districtFirst'))}</option>`;

/* ---------- the table ----------------------------------------------------
   One renderer for both pages.  A column declares how to sort itself (val)
   and how to print itself (cell); the serial is written after the sort, so
   it always numbers what is on screen. */
function Grid(el, state){ this.el = el; this.s = state; }
Grid.prototype.draw = function(cols, rows, opt){
  opt = opt || {};
  const s = this.s;
  const col = cols.find(c => c.k === s.key) || cols[0];
  if (col) {
    const dir = s.dir;
    rows = rows.slice().sort((a, b) => {
      const x = col.val(a), y = col.val(b);
      if (x == null && y == null) return 0;
      if (x == null) return 1;                    /* blanks always last */
      if (y == null) return -1;
      if (x < y) return -dir;
      if (x > y) return dir;
      return 0;
    });
  }
  let h = '';
  if (opt.groups) {
    h += '<thead><tr>';
    for (const g of opt.groups)
      h += `<th class="grp"${g.span > 1 ? ` colspan="${g.span}"` : ''}${g.align ? ` style="text-align:${g.align}"` : ''}>${g.h}</th>`;
    h += '</tr><tr class="r2">';
  } else {
    h += '<thead><tr class="r2">';
  }
  h += `<th class="sn" title="${esc(t('snHelp'))}">${esc(t('colSn'))}</th>`;
  for (const c of cols) {
    const on = s.key === c.k ? ' sorted' + (s.dir < 0 ? ' desc' : '') : '';
    h += `<th class="${c.cls || ''}${on}" data-k="${c.k}"`
       + (c.title ? ` title="${esc(c.title)}"` : '') + `>${c.h}</th>`;
  }
  h += '</tr></thead><tbody>';
  let n = 0;
  for (const r of rows) {
    h += '<tr><td class="sn">' + (++n) + '</td>';
    for (const c of cols) h += c.cell(r);
    h += '</tr>';
  }
  h += '</tbody>';
  if (opt.foot) h += '<tfoot><tr><td class="sn"></td>' + opt.foot(rows) + '</tr></tfoot>';
  this.el.innerHTML = h;
  this.rows = rows;
};
function gridClicks(tbl, state, redraw){
  tbl.addEventListener('click', e => {
    const mb = e.target.closest('.mbtn');
    if (mb) { e.stopPropagation(); if (mb.dataset.v !== state.measure) { state.measure = mb.dataset.v; redraw(); } return; }
    const th = e.target.closest('th[data-k]');
    if (!th) return;
    const k = th.dataset.k;
    if (state.key === k) state.dir *= -1;
    else { state.key = k; state.dir = th.classList.contains('l') ? 1 : -1; }
    redraw();
  });
}

}

/* Pearson's r over whatever is on screen — booths, or local bodies once they
   are gathered. Pairs where either side is missing are left out. */
function correl(xs, ys){
  let n = 0, sx = 0, sy = 0, sxx = 0, syy = 0, sxy = 0;
  for (let i = 0; i < xs.length; i++) {
    const x = xs[i], y = ys[i];
    if (x == null || y == null || isNaN(x) || isNaN(y)) continue;
    n++; sx += x; sy += y; sxx += x * x; syy += y * y; sxy += x * y;
  }
  if (n < 3) return null;
  const d = Math.sqrt((n * sxx - sx * sx) * (n * syy - sy * sy));
  return d === 0 ? null : {r:(n * sxy - sx * sy) / d, n:n};
}
function strength(r){
  const a = Math.abs(r);
  return a >= 0.7 ? 'rStrong' : a >= 0.4 ? 'rMedium' : a >= 0.2 ? 'rWeak' : 'rNone';
}

/* The report only covers 2026 parties: the demography is the 2026 roll, and
   earlier elections number their booths differently, so pairing them would be
   comparing two different sets of booths. */
function renderReport(rows, cols, picks){
  const box = $('creport');
  if (!S.report) { box.classList.add('hide'); return; }
  box.classList.remove('hide');
  const unit = t(S.view === 'lb' ? 'reportUnitL' : 'reportUnitB');
  const p26 = picks.filter(p => p.y === 2026);
  const dm = demoRows();
  if (!dm) { box.innerHTML = `<div class="rep"><h3>${esc(t('reportTitle'))}</h3>`
           + `<p class="muted">${esc(t('demoNone'))}</p></div>`; return; }
  if (!p26.length) { box.innerHTML = `<div class="rep"><h3>${esc(t('reportTitle'))}</h3>`
           + `<p class="muted">${esc(t('reportPick'))}</p></div>`; return; }

  const vars = DTAGS.filter(d => d[0] !== 'sur');
  const series = {};
  for (const [k] of vars) series[k] = rows.map(r => demoValue(r, k));

  let h = `<div class="rep"><h3>${esc(t('reportTitle'))}</h3>`;
  if (picks.length > p26.length) h += `<p class="muted">${esc(t('reportOnly26'))}</p>`;
  let n = 0;
  for (const p of p26) {
    const xs = rows.map(r => partyValue(r, p));
    const lines = [];
    for (const [k, lab] of vars) {
      const c = correl(xs, series[k]);
      if (!c) continue;
      n = c.n;
      const key = strength(c.r);
      const say = key === 'rNone'
        ? t('rLine0', {var:t(lab), party:p.p[0]})
        : t(c.r > 0 ? 'rLineP' : 'rLineN', {unit:unit, var:t(lab), party:p.p[0]});
      lines.push({r:c.r, lab:t(lab), key:key, say:say});
    }
    lines.sort((a, b) => Math.abs(b.r) - Math.abs(a.r));
    h += `<div class="grp"><div class="who">${esc(p.p[0])} · ${p.y}</div>`;
    for (const l of lines) {
      const w = Math.round(Math.min(Math.abs(l.r), 1) * 48);
      const bar = l.r >= 0 ? `left:50%;width:${w}px` : `left:${50 - w * 100 / 96}%;width:${w}px`;
      h += `<div class="line"><span class="var">${esc(l.lab)}</span>`
         + `<span class="bar2"><i class="${l.r < 0 ? 'neg' : ''}" style="${bar}"></i></span>`
         + `<span class="r">r = ${l.r.toFixed(2)} · ${esc(t(l.key))} ${esc(t(l.r >= 0 ? 'rPos' : 'rNeg'))}</span>`
         + `<span class="say">${esc(l.say)}</span></div>`;
    }
    h += '</div>';
  }
  h += `<div class="caution">${esc(t('rCaution', {n:fmt(n), unit:unit}))}</div></div>`;
  box.innerHTML = h;
}

function render(){
  drawPanel();
  const picks = S.ac == null ? [] : chosen();
  const dtags = S.ac == null ? [] : chosenDemo();
  const ncol = picks.length + dtags.length;
  $('colcount').textContent = ncol ? t('cmpCols', {n:ncol}) : '';
  $('tw').classList.toggle('hide', !ncol);
  const m = $('msg');
  m.className = 'note';
  if (S.ac == null) { m.innerHTML = t('cmpPickAc'); $('rowcount').textContent = '';
    $('tbl').innerHTML = ''; $('creport').classList.add('hide'); return; }
  if (!ncol) { m.innerHTML = t('cmpNone'); $('rowcount').textContent = '';
    $('tbl').innerHTML = ''; $('creport').classList.add('hide'); return; }

  const lb = S.view === 'lb';
  const dropped = lb && ALLYEARS.some(y => y !== 2026 && (S.sel[y] || []).length);
  m.innerHTML = dropped ? t('lbOnly2026') : t('cmpNote');
  if (dropped) m.className = 'note warn';

  const dmap = DMAP = demoMap();
  const di = k => demoIndex(k) + 1;          /* row is [part, …fields, surnames] */
  const SUR = 8;

  let rows, unit;
  if (lb) {
    /* gather the 2026 booths under their local body, and carry every chosen
       column through the same gathering */
    const ac = ac2026();
    const g = new Map();
    for (const b of (ac ? ac.booths : [])) {
      const key = b[3] || t('untagged');
      let e = g.get(key);
      if (!e) { e = {ps:key, v:[], tot:0, voters:0, wsum:{}, sur:new Map()}; g.set(key, e); }
      for (let i = 0; i < b[1].length; i++) e.v[i] = (e.v[i] || 0) + b[1][i];
      e.tot += b[2];
      const d = dmap && dmap.get(b[0]);
      if (d) {
        const w = d[1] || 0;                 /* weight the shares by the roll */
        e.voters += w;
        for (const [k] of DTAGS) {
          if (k === 'sur') continue;
          const v = d[di(k)];
          if (v != null) e.wsum[k] = (e.wsum[k] || 0) + v * w;
        }
        for (const [nm, pct] of surList(d[SUR])) e.sur.set(nm, (e.sur.get(nm) || 0) + pct * w);
      }
    }
    rows = [...g.values()].sort((a, b) => String(a.ps).localeCompare(String(b.ps), LANG));
    unit = 'lb';
  } else {
    const byYear = {};
    const all = new Set();
    for (const p of picks) {
      if (byYear[p.y]) continue;
      const map = new Map();
      for (const b of p.ac.booths) { map.set(b[0], b); all.add(b[0]); }
      byYear[p.y] = map;
    }
    if (dtags.length && dmap) for (const k of dmap.keys()) all.add(k);
    rows = [...all].sort((a, b) => boothKey(a) - boothKey(b))
                   .map(ps => ({ps:ps, _y:byYear}));
    unit = 'booth';
  }

  const cols = [{k:'ps', h:esc(t(lb ? 'colLb' : 'colBooth')), cls:lb ? 'l' : '',
                 val:r => lb ? String(r.ps).toLowerCase() : boothKey(r.ps),
                 cell:r => `<td class="${lb ? 'l ' : ''}dim">${esc(r.ps)}</td>`}];

  picks.forEach((p, n) => {
    const get = r => partyValue(r, p);
    cols.push({k:'x' + n, h:`${p.y}<br>${esc(p.p[0])}`, title:`${p.y} · ${p.p[1]}`,
               val:get,
               cell:r => { const v = get(r);
                 return v == null ? '<td class="na">—</td>' : `<td>${p2(v)}</td>`; }});
  });

  dtags.forEach((k, n) => {
    const lab = (DTAGS.find(d => d[0] === k) || [k, k])[1];
    let get, cell;
    if (k === 'sur') {
      get = r => {
        if (lb) return r.sur.size ? surText([...r.sur].map(x => [x[0], x[1] / (r.voters || 1)])
                                    .sort((a, b) => b[1] - a[1])) : null;
        const d = dmap && dmap.get(r.ps);
        return d ? surText(surList(d[SUR])) : null;
      };
      cell = r => { const v = get(r);
        return v == null ? '<td class="na">—</td>' : `<td class="l">${esc(v)}</td>`; };
    } else {
      get = r => demoValue(r, k);
      cell = r => { const v = get(r);
        return v == null ? '<td class="na">—</td>'
                         : `<td>${k === 'age' ? v.toFixed(1) : p2(v)}</td>`; };
    }
    cols.push({k:'d' + n, h:esc(t(lab)), cls:k === 'sur' ? 'l' : '',
               title:t('demo'), val:get, cell:cell});
  });

  const groups = [{h:esc(t(lb ? 'colLb' : 'grpBooth')), span:2, align:'left'}];
  let run = null;
  for (const p of picks) {
    if (run && run.y === p.y) { run.span++; continue; }
    run = {y:p.y, span:1};
    groups.push(run);
  }
  for (const g of groups) if (g.y) g.h = g.y + ' · ' + esc(t(KIND[g.y]));
  if (dtags.length) groups.push({h:esc(t('demo')), span:dtags.length});

  grid.draw(cols, rows, {groups:groups});
  $('rowcount').textContent = lb ? t('lbCount', {n:fmt(rows.length)})
                                 : t('boothsShown', {n:fmt(rows.length)});
  renderReport(rows, cols, picks);
}

$('dist').onchange = e => { S.dist = e.target.value; S.ac = null; S.sel = {};
  fillACs($('ac'), D0, S.dist, null); render(); };
$('ac').onchange = e => { S.ac = e.target.value ? +e.target.value : null; S.sel = {};
  S.key = 'ps'; S.dir = 1; render(); };
$('clear').onclick = () => { S.sel = {}; S.demo = []; render(); };

$('report').onclick = () => {
  S.report = !S.report;
  $('report').classList.toggle('on', S.report);
  if (S.report && !window.DEMO) { render(); loadDemo().then(render); }
  else render();
};

$('viewby').onclick = e => {
  const b = e.target.closest('button[data-v]');
  if (!b || b.dataset.v === S.view) return;
  S.view = b.dataset.v;
  [...$('viewby').children].forEach(x => x.classList.toggle('on', x === b));
  S.key = 'ps'; S.dir = 1;
  /* the local bodies themselves come from the 2026 data, whether or not a
     2026 party is on show */
  if (S.view === 'lb' && !(window.EL && window.EL[2026])) {
    render();
    loadYear(2026).then(render);
  } else render();
};

$('years').addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.d != null) {
    const k = el.dataset.d, at = S.demo.indexOf(k);
    if (el.checked && at < 0) S.demo.push(k);
    if (!el.checked && at >= 0) S.demo.splice(at, 1);
    if (S.demo.length && !window.DEMO) { render(); loadDemo().then(render); }
    else render();
    return;
  }
  if (el.dataset.p != null) {
    const y = +el.dataset.y, i = +el.dataset.p;
    const list = S.sel[y] || (S.sel[y] = []);
    const at = list.indexOf(i);
    if (el.checked && at < 0) list.push(i);
    if (!el.checked && at >= 0) list.splice(at, 1);
    render();
    return;
  }
  const y = +el.dataset.y;
  if (!el.checked) { delete S.sel[y]; render(); return; }
  S.sel[y] = [];
  render();                                   /* shows "loading…" at once */
  loadYear(y).then(() => {
    const ac = acIn(y, S.ac);
    /* start on the party that took the most votes, so a click is enough */
    if (ac && S.sel[y] && !S.sel[y].length) {
      const sums = ac.parties.map((p, i) => ac.booths.reduce((s, b) => s + b[1][i], 0));
      S.sel[y] = [sums.indexOf(Math.max.apply(null, sums))];
    }
    render();
  });
});

gridClicks($('tbl'), S, render);
langSwitch(() => { setTitle(); fillDistricts($('dist'), D0, S.dist);
  fillACs($('ac'), D0, S.dist, S.ac); render(); });

applyStatic(); setTitle();
fillDistricts($('dist'), D0, S.dist);
fillACs($('ac'), D0, S.dist, S.ac);
render();

</script>
</body>
</html>
